<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14508c">
<title>ASTRA Limpadora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#14508c;--p2:#2b7bd1;--bg:#eef3f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#f8fafc;--ok:#16a34a;--r:18px;--sh:0 8px 24px -12px #14508c55}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e6edf7;--mut:#8b9ab3;--line:#243049;--soft:#0f1829;--sh:0 8px 24px -12px #000a}}
*{-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx);padding-bottom:96px}
header{background:linear-gradient(135deg,#0c3560,var(--p) 55%,var(--p2));color:#fff;padding:16px 18px 20px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 28px 28px;box-shadow:0 14px 30px -14px #14508cbb}
header img{filter:drop-shadow(0 3px 6px #0005);animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.98)}}
nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 20px));display:flex;overflow-x:auto;background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;box-shadow:0 12px 32px -8px #0006;padding:6px;z-index:9;scrollbar-width:none}
nav button{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:66px;padding:8px 6px;border:0;background:none;color:var(--mut);font-family:inherit;font-weight:700;font-size:10.5px;border-radius:18px;transition:.3s}
nav button i{font-style:normal;font-size:21px;transition:transform .3s}
nav button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 14px -6px var(--p)}
nav button.on i{transform:translateY(-2px) scale(1.18)}
main{max-width:720px;margin:auto;padding:18px 14px}
h3{margin:0 0 6px;font-weight:800}
.card{background:var(--card);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--sh);animation:up .55s cubic-bezier(.2,.8,.2,1) both;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px)}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;margin:4px 0;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;background:var(--soft);color:var(--tx);transition:.2s}
input:focus,select:focus{outline:0;border-color:var(--p2);box-shadow:0 0 0 4px #2b7bd133}
button.b{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0;border-radius:12px;padding:10px 15px;margin:6px 6px 0 0;font-family:inherit;font-weight:700;font-size:13px;box-shadow:0 8px 16px -8px var(--p);transition:.2s;position:relative;overflow:hidden;cursor:pointer}
button.b:hover{transform:translateY(-2px)}button.b:active{transform:scale(.94)}
button.g{background:linear-gradient(135deg,#15803d,#22c55e)}button.r{background:linear-gradient(135deg,#b91c1c,#ef4444)}
#out{background:#ffffff26;box-shadow:none;margin:0}
.rp{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff7;animation:rp .6s forwards;pointer-events:none}@keyframes rp{to{transform:scale(25);opacity:0}}
small{color:var(--mut)}summary{cursor:pointer}
.pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:#fef3c7;color:#b45309;text-transform:uppercase;letter-spacing:.4px}.pill.concluido{background:#dcfce7;color:#15803d}.pill.pg_pago{background:#dcfce7;color:#15803d}.pill.pg_cancelado{background:#fee2e2;color:#b91c1c}.pill.pg_garantia{background:#dbeafe;color:#1d4ed8}
.stat{color:#fff;border-radius:22px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:var(--sh);animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.stat:after{content:"";position:absolute;right:-30px;top:-34px;width:120px;height:120px;border-radius:50%;background:#ffffff24}
.stat small{color:#ffffffd9}.stat b{display:block;font-size:32px;margin:4px 0;font-weight:800}
.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#15803d,#22c55e);border-radius:9px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.avbar{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:14px;margin-bottom:10px}
.avb{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-family:inherit;font-weight:700;font-size:13px;color:var(--mut);cursor:pointer;transition:.2s}
.avb.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 14px -8px var(--p)}
.avnav{display:flex;align-items:center;gap:6px}.avnav b{flex:1;text-align:center;font-size:16px}
.avarw{border:1.5px solid var(--line);background:var(--soft);color:var(--tx);border-radius:10px;min-width:40px;height:38px;font-size:18px;font-family:inherit;font-weight:700;cursor:pointer}
.avarw.avhj{font-size:13px;padding:0 10px}
.avsum{text-align:center;color:var(--mut);font-size:13px;margin-top:6px}
.avleg{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:11.5px;color:var(--mut);margin-top:8px}
.avleg span[style]::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.avsec{font-weight:800;margin:16px 4px 8px;color:var(--p2);font-size:15px}.avsec small{font-weight:600;color:var(--mut);margin-left:6px;font-size:12.5px}
.s-age{--bc:#2b7bd1}.s-con{--bc:#16a34a}.s-can{--bc:#94a3b8}
.avk{border-left:6px solid var(--bc)}.avk.s-can{opacity:.75}
.avw{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.avd{background:var(--card);border-radius:14px;padding:6px;box-shadow:var(--sh);min-height:110px;min-width:0}
.avd.hj{outline:2.5px solid var(--p2)}.avd.bl{background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 6px,var(--card) 6px,var(--card) 12px)}
.avdh{font-size:12px;padding:2px 2px 6px;cursor:pointer;color:var(--mut)}.avdh b{color:var(--tx)}
.avdh small{float:right;background:var(--p);color:#fff;border-radius:9px;padding:0 6px;font-weight:700}
.avc{border-left:4px solid var(--bc);border-radius:8px;background:var(--soft);padding:5px 6px;margin-bottom:5px;font-size:12px;cursor:pointer;line-height:1.3;overflow:hidden}
.avc:hover{filter:brightness(.96)}.avc.s-can{opacity:.6;text-decoration:line-through}
.avc small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avnone{font-size:11.5px;color:var(--mut);text-align:center;padding-top:14px}
@media(max-width:640px){.avw{grid-template-columns:1fr}.avd{min-height:0}.avd.vz{display:flex;align-items:center;justify-content:space-between;padding:6px 10px}.avd.vz .avdh{padding:0}.avd.vz .avnone{padding:0}.avdh{font-size:13.5px}.avc{font-size:13.5px}}
.avmg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.avmh{font-size:11px;font-weight:800;color:var(--mut);text-align:center;padding:2px 0}
.avm{background:var(--card);border-radius:10px;min-height:78px;padding:4px;cursor:pointer;box-shadow:var(--sh);overflow:hidden;min-width:0}
.avm.tem{background:color-mix(in srgb,var(--p2) 9%,var(--card))}.avm.out{opacity:.35}.avm.hj{outline:2.5px solid var(--p2)}
.avm.bl{background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 6px,var(--card) 6px,var(--card) 12px)}
.avn{font-size:12px;font-weight:800}
.avm i{display:block;font-style:normal;font-size:10.5px;border-left:3px solid var(--bc);padding-left:3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avm i.more{border:0;color:var(--mut)}
@media(max-width:560px){.avm{min-height:54px;padding:3px}.avm i{font-size:0;display:inline-block;width:7px;height:7px;border-radius:50%;border:0;margin:3px 1px 0;padding:0}.avm i{background:var(--bc)}.avm i.more{font-size:9px;width:auto;height:auto;background:none}}
.flash{animation:fla 1.8s}@keyframes fla{0%,45%{box-shadow:0 0 0 4px #f59e0b}}
details.card>summary{cursor:pointer;list-style:none}details.card>summary::-webkit-details-marker{display:none}
.ver{font-size:11px;color:#ffffffb3}
</style></head><body>

<header><span style="display:flex;align-items:center;gap:8px"><img id="lg" height="36" alt=""><span><b style="font-size:18px">ASTRA Limpadora</b><br><small style="color:#ffffffb3">Gestão de serviços · <span class=ver id=ver></span></small></span></span><button class="b" id="out" onclick="sb.auth.signOut().then(()=>location.reload())" style="display:none">Sair</button></header>
<div id="app"></div>
<script>
function erroTela(m){document.getElementById('app').innerHTML='<main><div class=card style="border-left:5px solid #dc2626"><b>Erro ao iniciar</b><br>'+m+'</div></main>'}
window.addEventListener('error',e=>erroTela(e.message));
let sb;try{if(typeof supabase==='undefined')throw new Error('Biblioteca do Supabase não carregou. Verifique a internet.');
if(SUPABASE_URL.includes('COLE_A')||SUPABASE_KEY.includes('COLE_A'))throw new Error('A URL ou a chave do Supabase ainda não foram colocadas na linha 20 do arquivo.');
sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){erroTela(e.message)}
let C=[],S=[],K=[],O=[],A=[],NR=[{nome:'',tipo:'servico',valor:0}],FS={},tab='agenda',M=6,CF={dias:[1,2,3,4,5,6],atende_feriados:false},B=[],Q=[],INS=[],DESP=[],SQL5=false,DM=false,PM=false,PL={s:[],e:[]},PE=null,ES=null,AG=false,SQLX=false,TX={deb:1.99,c1:4.99,c2:7,c3:8.41},FM='',EO=null,OC=null,OV=null,OCO=0,OFR=0,OQ=null,OQM='',SVO=null,QB='',EC=null,NC=false,CB='';
try{M=+localStorage.getItem('astra_m')||6}catch(e){}
const $=s=>document.querySelector(s), v=id=>$('#'+id).value;
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const money=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const mk=e=>{e.value=money(parseInt(e.value.replace(/\D/g,'')||'0',10)/100)};
const pm=id=>parseInt(v(id).replace(/\D/g,'')||'0',10)/100;
const dt=d=>new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const dd=d=>new Date(d).toLocaleDateString('pt-BR');
const cli=id=>C.find(c=>c.id===id)||{};
const fn=c=>String(c.nome||'').trim().split(/\s+/)[0];
const full=c=>[c.nome,c.sobrenome].filter(Boolean).join(' ');
const ender=c=>c.rua?c.rua+(c.numero?', '+c.numero:'')+(c.bairro?' - '+c.bairro:'')+(c.cidade?', '+c.cidade:''):(c.endereco||'');
const addM=(d,m)=>{const x=new Date(d);x.setMonth(x.getMonth()+Number(m||6));return x};
const wa=(tel,msg)=>{let n=String(tel||'').replace(/\D/g,'');if(n.length<=11)n='55'+n;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank')};
document.addEventListener('keydown',e=>{if(e.target.type=='number'&&['-','+','e','E'].includes(e.key))e.preventDefault()});
(()=>{const l=(r,x)=>{const e=document.createElement('link');e.rel=r;e.href=x;document.head.appendChild(e)};
l('icon',LOGO);l('apple-touch-icon',LOGO);
try{l('manifest',URL.createObjectURL(new Blob([JSON.stringify({name:'ASTRA Limpadora',short_name:'ASTRA',start_url:location.href,display:'standalone',background_color:'#ffffff',theme_color:'#14508c',icons:[{src:LOGO,sizes:'300x300',type:'image/png'}]})],{type:'application/manifest+json'})))}catch(e){}
$('#lg').src=LOGO})();

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('#app').innerHTML=`<main><div class=card><div style="text-align:center;font-size:46px;animation:fl 3s infinite">✨</div><h2 style="text-align:center;margin:0 0 10px">Entrar na ASTRA</h2><input id=em type=email placeholder="E-mail (ex: voce@email.com)"><input id=pw type=password placeholder="Sua senha"><button class=b onclick=login()>Entrar</button></div></main>`;return}
  $('#out').style.display='';load();
}
async function login(){const {error}=await sb.auth.signInWithPassword({email:v('em'),password:v('pw')});error?alert('Erro: '+error.message):init()}
async function load(){
  const a=await sb.from('astra_clientes').select('*').order('nome');
  const b=await sb.from('astra_servicos').select('*').order('data_hora');
  const k=await sb.from('astra_catalogo').select('*').order('nome');
  if(a.error||b.error||k.error)return alert((a.error||b.error||k.error).message);
  const f=await sb.from('astra_config').select('*').eq('id',1).maybeSingle();
  const bl=await sb.from('astra_bloqueios').select('*').order('data');
  if(f.error||bl.error)return alert('Rode o arquivo astra-dias.sql no Supabase. '+(f.error||bl.error).message);
  const oq=await sb.from('astra_orcamentos').select('*').order('created_at',{ascending:false});
  if(oq.error)return alert('Rode o arquivo astra-financeiro.sql no Supabase. '+oq.error.message);
  if(f.data)CF={dias:f.data.dias||[1,2,3,4,5,6],atende_feriados:!!f.data.atende_feriados};
  const ii=await sb.from('astra_insumos').select('*').order('created_at');INS=ii.error?[]:ii.data;SQLX=!!ii.error;if(f.data&&f.data.taxas)TX={...TX,...f.data.taxas};
  const dp=await sb.from('astra_despesas').select('*').order('data',{ascending:false});DESP=dp.error?[]:dp.data;SQL5=!!dp.error;C=a.data;S=b.data;K=k.data;B=bl.data;Q=oq.data;draw();
}
const KEEP=['os_d','os_f','s_c','s_d','s_e','s_m','o_c','s_o','s_f','s_com','s_fv','s_pg','s_fp','s_pc','o_fp','o_pc'];
function draw(){
  KEEP.forEach(i=>{const e=$('#'+i);if(e)FS[i]=e.value});const fa=$('#s_fa');if(fa){FS.s_fa=fa.checked;FS.s_ex=$('#s_ex').checked}
  const n=pend().filter(x=>!x.u.lembrete_enviado).length;
  const T={clientes:'Clientes',orc:'Orçamento',agenda:'Agenda',cat:'Preços',fin:'Financeiro',reativar:'Lembretes'+(n?' ('+n+')':''),disp:'Horários',custos:'Custos'};
  const body={agenda:vAgenda,clientes:vClientes,cat:vCat,reativar:vReativar,orc:vOrc,fin:vFin,disp:vDisp,custos:vCustos}[tab]();
  $('#app').innerHTML=`<nav>${Object.keys(T).map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';draw()"><i>${{agenda:'📅',clientes:'👥',cat:'🏷️',orc:'🧾',fin:'📊',reativar:'🔔',disp:'⏰',custos:'🧴'}[k]}</i>${T[k]}</button>`).join('')}</nav><main>${body}</main>`;

function vOS(){const fs=[...new Set(S.map(s=>(s.funcionario||'').trim()).filter(Boolean))].sort();
  return `<div class=card><h3>🖨️ Ordem de serviço do dia</h3><small>Escolha o dia e, se quiser, o funcionário. O PDF sai com horário, cliente, telefone, endereço (com link do mapa), serviço e o que cobrar.</small>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:140px"><small>Dia</small><input type=date id=os_d value="${ds(new Date())}"></div>
  <div style="flex:1;min-width:140px"><small>Funcionário</small><select id=os_f><option value="">Todos</option>${fs.map(f=>`<option>${esc(f)}</option>`).join('')}</select></div></div>
  <button class="b g" onclick="osPDF(false)">⬇️ Baixar PDF</button><button class=b onclick="osPDF(true)">🖨️ Imprimir</button></div>`}
function osPDF(imprimir){
  const dia=v('os_d'),fu=v('os_f');if(!dia)return alert('Escolha o dia.');
  const L=S.filter(s=>ds(new Date(s.data_hora))==dia&&s.pagamento!='cancelado'&&(!fu||(s.funcionario||'').trim()==fu)).sort((a,b)=>new Date(a.data_hora)-new Date(b.data_hora));
  if(!L.length)return alert('Nenhum serviço '+(fu?'de '+fu+' ':'')+'em '+dd(dia+'T12:00:00')+'.');
  const t=x=>String(x??'').replace(/[^\x00-\xFF]/g,'').replace(/\s+/g,' ').trim(); // a fonte do PDF nao tem emojis
  const d=new jspdf.jsPDF({unit:'mm',format:'a4'}),W=210,M=14,CW=W-2*M,AZ=[20,80,140],VX=M+30,VW=CW-33;
  d.setLineHeightFactor(1.35);
  let dt0=new Date(dia+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});dt0=dt0.charAt(0).toUpperCase()+dt0.slice(1);
  let y=0;
  const head=()=>{d.addImage(LOGO2,'PNG',M,9,18.3,20);d.setTextColor(...AZ);d.setFont('helvetica','bold');d.setFontSize(18);d.text('ORDEM DE SERVIÇO',M+24,16);
    d.setFont('helvetica','normal');d.setFontSize(11);d.setTextColor(40,40,40);d.text(t(dt0),M+24,22);
    d.text(t((fu?'Funcionário: '+fu:'Todos os funcionários')+'  ·  '+L.length+' serviço(s)'),M+24,27.5);
    d.setDrawColor(...AZ);d.setLineWidth(.6);d.line(M,32,W-M,32);y=37};
  head();
  L.forEach((s,i)=>{const c=cli(s.cliente_id),end=t(s.endereco||ender(c))||'-',hr=new Date(s.data_hora).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const pg=s.pagamento||'aguardando',formas=pg=='aguardando'?t(pgTxt(s)):'';
    const cobrar=pg=='pago'?'JÁ PAGO - não cobrar':pg=='garantia'?'GARANTIA - sem cobrança':'A RECEBER: '+t(brl(s.valor))+(formas?'  ('+formas+')':'');
    d.setFontSize(10.5);
    const R=[['Telefone',[t(c.telefone)||'-']],['Endereço',d.splitTextToSize(end,VW)],['Serviço',d.splitTextToSize(t(s.tipo)||'-',VW)],['Pagamento',d.splitTextToSize(cobrar,VW)]];
    if(!fu&&t(s.funcionario))R.push(['Funcionário',[t(s.funcionario)]]);
    if(t(c.obs))R.push(['Observações',d.splitTextToSize(t(c.obs),VW)]);
    const nl=R.reduce((a,r)=>a+r[1].length,0),h=10+nl*5+16;
    if(y+h>284){d.addPage();head()}
    const y0=y;d.setFillColor(232,240,250);d.roundedRect(M,y0,CW,9,2,2,'F');d.rect(M,y0+5,CW,4,'F');
    d.setDrawColor(190,200,215);d.setLineWidth(.3);d.roundedRect(M,y0,CW,h,2,2);
    d.setFont('helvetica','bold');d.setFontSize(12);d.setTextColor(...AZ);d.text('#'+(i+1)+'   '+hr,M+3,y0+6.3);
    d.setTextColor(25,25,25);d.text(d.splitTextToSize(t(full(c))||'Cliente',CW-40)[0],M+32,y0+6.3);
    y=y0+15;d.setFontSize(10.5);
    R.forEach(([lab,lines])=>{d.setFont('helvetica','bold');d.setTextColor(95,95,95);d.text(lab,M+3,y);
      d.setFont('helvetica',lab=='Pagamento'?'bold':'normal');d.setTextColor(25,25,25);d.text(lines,VX,y);
      if(lab=='Endereço'&&end!='-'){d.setFont('helvetica','normal');d.setFontSize(9);d.setTextColor(...AZ);
        d.textWithLink('abrir no mapa',W-M-3-d.getTextWidth('abrir no mapa'),y,{url:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(end)});d.setFontSize(10.5)}
      y+=5*lines.length});
    d.setDrawColor(120,120,120);d.setFont('helvetica','normal');d.setFontSize(9.5);d.setTextColor(60,60,60);
    const yc=y0+h-5;d.rect(M+3,yc-3,3.2,3.2);d.text('Serviço realizado',M+8,yc);d.rect(M+45,yc-3,3.2,3.2);d.text('Pagamento recebido',M+50,yc);
    d.text('Assinatura do cliente: ________________________',M+92,yc);
    y=y0+h+4});
  const np=d.getNumberOfPages();for(let p=1;p<=np;p++){d.setPage(p);d.setFont('helvetica','normal');d.setFontSize(8.5);d.setTextColor(130,130,130);d.text('ASTRA Limpadora  ·  Página '+p+' de '+np,W/2,291,{align:'center'})}
  const nome='OS-ASTRA-'+dia+(fu?'-'+fu.replace(/[^\w-]+/g,'_'):'')+'.pdf';
  if(imprimir){d.autoPrint();const w=window.open(d.output('bloburl'),'_blank');if(!w)d.save(nome)}else d.save(nome);
}
function cert(id){
  const s=S.find(x=>x.id==id),c=cli(s.cliente_id),d=new jspdf.jsPDF({orientation:'landscape'}),m=148.5;
  d.setDrawColor(20,80,140);d.setLineWidth(1.5);d.rect(8,8,281,194);d.setLineWidth(.4);d.rect(12,12,273,186);
  d.addImage(LOGO,'PNG',m-17,16,34,34);
  d.setTextColor(20,80,140);d.setFont('helvetica','bold');d.setFontSize(30);d.text('CERTIFICADO DE HIGIENIZAÇÃO',m,64,{align:'center'});
  d.setTextColor(30,30,30);d.setFont('helvetica','normal');d.setFontSize(15);d.text('Certificamos que foi realizado o serviço de',m,84,{align:'center'});
  d.setFont('helvetica','bold');d.setFontSize(22);d.text(d.splitTextToSize(s.tipo,240),m,96,{align:'center'});
  d.setFont('helvetica','normal');d.setFontSize(15);d.text('para o cliente',m,110,{align:'center'});
  d.setFont('helvetica','bold');d.setFontSize(26);d.text(full(c),m,123,{align:'center'});
  d.setFont('helvetica','normal');d.setFontSize(14);
  d.text('Data do serviço: '+dd(s.data_hora),m,141,{align:'center'});
  d.text('Nova higienização recomendada a partir de: '+dd(addM(s.data_hora,s.intervalo_meses)),m,151,{align:'center'});
  d.line(100,178,197,178);d.setFontSize(12);d.text('ASTRA Limpadora',m,185,{align:'center'});
  d.save('certificado-'+(full(c)||'cliente').replace(/\s+/g,'-').toLowerCase()+'.pdf');
}
